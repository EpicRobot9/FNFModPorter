name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run --workspace @fnf-porter/core test
      - run: npm run build
      - run: node packages/cli/dist/index.js port packages/core/tests/fixtures/psych --dry-run
      - run: npm run ci:artifacts
      - name: Upload hosting artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fnf-web-artifacts
          path: |
            outputs/**/**-web.zip
            outputs/**/build.json
            outputs/**/thumb.png
            ci-artifacts/**
